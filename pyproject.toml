[project]
name = "task-cli"
version = "0.0.1"
authors = [
    {name = "gafip"}
]
dependencies=[
    "platformdirs>=4.0"
]

[project.scripts]
task-cli = "TaskTrackerCLI:main"

[tool.setuptools]
py-modules = ["TaskTrackerCLI", "Tasks"]